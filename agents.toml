version = 1
agents = ["claude", "cursor", "codex", "vscode", "opencode"]

[trust]
allow_all = true

# Lean install manifest generated 2026-08-21.
# The full canonical library remains in skills/ for on-demand use.
# Use `dotagents install`; do not run `dotagents sync`.
# Local/personal skills from default-profile.toml, such as skill-router,
# skill-create, skill-add, skill-update, skill-cleanup, skill-remove, and
# postplan-upload, are installed manually because `source = "path:skills/..."`
# has been unreliable on this Windows + user-scope symlink setup.

# === dotagents tool itself ===

[[skills]]
name = "dotagents"
source = "getsentry/dotagents"

# === Caveman workflow helpers ===

[[skills]]
name = "cavecrew"
source = "JuliusBrussee/caveman"
